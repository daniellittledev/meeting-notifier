name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OutlookNotifier.sln

      - name: Build
        run: dotnet build OutlookNotifier.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/OutlookNotifier.Tests/OutlookNotifier.Tests.fsproj -c Release --no-build --verbosity normal
